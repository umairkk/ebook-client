<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="LTC Justin Foote in uniform">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4a5a"/>
      <stop offset="1" stop-color="#1c2530"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#fbg)"/>
  <!-- flag stripes hint -->
  <g opacity="0.18">
    <rect x="0" y="0" width="120" height="500" fill="#8a1f2b"/>
    <rect x="0" y="0" width="60" height="240" fill="#1f3a6b"/>
  </g>
  <!-- head -->
  <circle cx="250" cy="185" r="78" fill="#c9a888"/>
  <!-- hair -->
  <path d="M172 175 q6 -80 78 -80 q72 0 78 80 q-20 -34 -78 -34 q-58 0 -78 34 Z" fill="#4a3a2a"/>
  <!-- uniform shoulders -->
  <path d="M120 500 q10 -150 130 -170 q120 20 130 170 Z" fill="#5b613a"/>
  <path d="M250 330 l0 170 M210 340 q40 30 80 0" stroke="#474d2c" stroke-width="6" fill="none"/>
  <!-- rank / ribbons hint -->
  <g fill="#c9a34e">
    <rect x="190" y="380" width="46" height="7"/>
    <rect x="190" y="392" width="46" height="7"/>
    <rect x="264" y="380" width="46" height="7"/>
    <rect x="264" y="392" width="46" height="7"/>
  </g>
</svg>
