<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img" aria-label="The Battle of Do Ab book cover">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2f1e"/>
      <stop offset="0.5" stop-color="#6b4a28"/>
      <stop offset="1" stop-color="#1c150c"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#sky)"/>
  <!-- mountains -->
  <path d="M0 400 L70 300 L140 380 L220 270 L300 370 L400 300 L400 600 L0 600 Z" fill="#20180d" opacity="0.9"/>
  <path d="M0 460 L90 380 L180 450 L260 360 L340 440 L400 400 L400 600 L0 600 Z" fill="#140e07"/>
  <!-- helicopter silhouette -->
  <g fill="#0c0905" opacity="0.85">
    <ellipse cx="300" cy="150" rx="34" ry="10"/>
    <rect x="284" y="146" width="55" height="9" rx="4"/>
    <rect x="250" y="130" width="120" height="5"/>
    <rect x="333" y="150" width="26" height="4"/>
  </g>
  <!-- soldiers silhouettes -->
  <g fill="#0a0704">
    <path d="M120 560 q6 -40 14 -46 q-4 -18 6 -20 q10 2 6 20 q10 8 12 46 Z"/>
    <path d="M170 560 q6 -46 16 -52 q-4 -20 6 -22 q12 2 8 22 q10 8 12 52 Z"/>
    <path d="M230 560 q5 -38 12 -44 q-4 -16 6 -18 q9 2 6 18 q9 7 10 44 Z"/>
  </g>
  <rect width="400" height="600" fill="url(#fade)"/>
  <!-- text -->
  <text x="200" y="70" text-anchor="middle" fill="#e9e2d2" font-family="Oswald, Arial Narrow, sans-serif" font-size="20" letter-spacing="3" font-weight="600">MIRACULOUS TURN OF EVENTS</text>
  <text x="200" y="230" text-anchor="middle" fill="#cb4a1f" font-family="Oswald, Arial Narrow, sans-serif" font-size="52" font-weight="700" letter-spacing="2">THE BATTLE</text>
  <text x="200" y="290" text-anchor="middle" fill="#cb4a1f" font-family="Oswald, Arial Narrow, sans-serif" font-size="52" font-weight="700" letter-spacing="2">OF DO AB</text>
  <text x="200" y="540" text-anchor="middle" fill="#c9a34e" font-family="Oswald, Arial Narrow, sans-serif" font-size="20" letter-spacing="2" font-weight="600">JOHN KELLING</text>
  <text x="200" y="568" text-anchor="middle" fill="#e9e2d2" font-family="Oswald, Arial Narrow, sans-serif" font-size="16" letter-spacing="2">LTC JUSTIN FOOTE</text>
</svg>
